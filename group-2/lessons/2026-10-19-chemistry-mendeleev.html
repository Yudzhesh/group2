// Функция для отрисовки атома
function renderAtom(z) {
  const el = elementsData.find(e => e.z === parseInt(z));
  if(!el) return;
  
  const scene = document.getElementById('atom-scene');
  scene.innerHTML = `<div class="nucleus">+${el.z}</div>`;
  
  el.shells.forEach((electronCount, index) => {
    const radius = 60 + index * 40;
    const shell = document.createElement('div');
    shell.className = 'shell';
    shell.style.width = radius * 2 + 'px';
    shell.style.height = radius * 2 + 'px';
    
    for(let i=0; i<electronCount; i++) {
        const angle = (i / electronCount) * 360;
        const electron = document.createElement('div');
        electron.className = 'electron';
        electron.style.transform = `rotate(${angle}deg) translateX(${radius}px)`;
        electron.style.left = `calc(50% - 5px)`;
        electron.style.top = `calc(50% - 5px)`;
        shell.appendChild(electron);
    }
    scene.appendChild(shell);
  });
}
